<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NeuroPanel{% endblock %} · Hippocampus gene-panel explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // Apply the saved light/dark theme before the page is drawn (no flicker)
    document.documentElement.classList.add("js");
    try {
      var saved = localStorage.getItem("theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <path d="M10 4c6 4 6 8 0 12s-6 8 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M22 4c-6 4-6 8 0 12s6 8 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M12 8h8M11 16h10M12 24h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/>
          </svg>
        </span>
        <span>NeuroPanel</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Analyze</a>
        <a href="{{ url_for('example') }}" class="{% if request.endpoint == 'example' %}active{% endif %}">Example</a>
        <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">How it works</a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch light or dark theme" title="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p><strong>Educational project. Not a medical test.</strong> The results describe similarity to groups in one research dataset (GSE48350) and are not a diagnosis.</p>
      <p class="muted">Built with Python (Flask), HTML, CSS and a little JavaScript.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
